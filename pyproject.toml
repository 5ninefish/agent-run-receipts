[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-run-receipts"
version = "0.1.0"
description = "Tamper-evident receipts for one agent-produced change: diff + transcript + policy + tests."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Dalen Kahiapo" }]
requires-python = ">=3.9"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]

[project.scripts]
arr = "arr.cli:main"

[tool.setuptools]
packages = ["arr"]
