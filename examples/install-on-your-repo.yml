# Copy to .github/workflows/agent-run-receipt.yml in YOUR repo.
# After that, you do not run anything. Every pull request gets a receipt.
#
#   uses: 5ninefish/agent-run-receipts@v0   once a release tag exists
#   until then, pin the main SHA or copy this file as-is after you vendor the
#   action (the public repo's own workflow uses the in-tree CLI).

name: Agent run receipt

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
      - uses: 5ninefish/agent-run-receipts@main
        with:
          diff: /tmp/pr.diff
          output: agent-run-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-run-receipt
          path: agent-run-receipt.json
